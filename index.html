<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ideas on Ideas</title>
    <meta name="description" content="A keyboard-first brainstorming canvas. Grow ideas from a center, spark new branches, prune, harvest. Everything stays in your browser." />
    <meta name="theme-color" content="#0d0e12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var s = JSON.parse(localStorage.getItem('ioi:v1:settings') || '{}');
        var t = s.theme && s.theme !== 'system' ? s.theme : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
